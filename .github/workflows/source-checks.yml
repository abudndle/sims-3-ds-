name: Sims 3 DS research validation
on:
  push:
    branches: [main, dev, 'feature/**', 'milestone/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: research-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-source:
    name: Verify source without game ROMs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure no original game dumps are committed to public Git
        shell: bash
        run: |
          python3 scripts/validate_public_repository.py
      - name: Validate Python syntax for checked-in tooling
        shell: bash
        run: |
          python3 -m compileall -q tools research
      - name: Run independent unit tests (ROM-dependent tests skip)
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_handler_memory -p 'test_*.py' -v
      - name: Run ARM7-to-ARM9 handoff tests (no ROM in public CI)
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_shared_handoff -p 'test_*.py' -v
      - name: Run ARM7 field-provenance decoder tests
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_field_provenance -p 'test_*.py' -v
      - name: Verify touchscreen ADC command classification
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_touch_aux -p 'test_*.py' -v
      - name: Run ARM7 ADC immediate-candidate audit tests
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_adc_candidates -p 'test_*.py' -v
      - name: Test ARM7 SPI firmware versus touchscreen bus classification
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_spi_device_classification -p 'test_*.py' -v
      - name: Verify game-card-bus D8 exclusion tests
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_gamecard_d8 -p 'test_*.py' -v
      - name: Test indirect D0 ARM7 command candidate
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm7_d0_call_path -p 'test_*.py' -v
      - name: Test ARM7/ARM9 packed 12-bit shared fields
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_packed_shared_fields -p 'test_*.py' -v
      - name: Verify lossless touchscreen sample contract
        shell: bash
        run: |
          python3 -m unittest discover -s tools/touch_sample_contract -p 'test_*.py' -v
      - name: Verify ARM9 packed-input callback boundary
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_event_boundary -p 'test_*.py' -v
      - name: Check ARM9 Timer3 interrupt handler registration
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_irq_registration -p 'test_*.py' -v
      - name: Verify ARM9 callback slot initialization and reference inventory
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_callback_inventory -p 'test_*.py' -v
      - name: Verify ARM9 third callback call site
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_callback_paths -p 'test_*.py' -v
      - name: Verify ARM9 touchscreen calibration boundary
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_touch_calibration -p 'test_*.py' -v
      - name: Test original-HUD page navigation contract
        shell: bash
        run: |
          python3 -m unittest discover -s tools/hud_page_navigation -p 'test_*.py' -v
      - name: Test bottom-screen HUD notification queue
        shell: bash
        run: |
          python3 -m unittest discover -s tools/hud_notifications -p 'test_*.py' -v
      - name: Test HUD page and notification overlay integration
        shell: bash
        run: |
          python3 -m unittest discover -s tools/hud_overlay_controller -p 'test_*.py' -v
      - name: Verify Page-0 reopenable job opportunities
        shell: bash
        run: |
          python3 -m unittest discover -s tools/hud_job_offers -p 'test_*.py' -v
      - name: Test combined HUD job-offer game session
        shell: bash
        run: |
          python3 -m unittest discover -s tools/hud_game_session -p 'test_*.py' -v
      - name: Verify ARM9 touchscreen calibration caller
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_calibration_caller -p 'test_*.py' -v
      - name: Verify ARM9 touchscreen synchronization gate
        shell: bash
        run: |
          python3 -m unittest discover -s tools/arm9_touch_sync_gate -p 'test_*.py' -v
      - name: Explain current ROM-build status
        shell: bash
        run: |
          echo 'Research validation only: no ROM build system or gameplay hook has been verified.'
          echo 'Original game ROMs and assets are deliberately unavailable to this public runner.'
