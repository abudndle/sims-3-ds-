name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q tools
      - name: Public tests (ROM-dependent tests skip)
        run: python -m unittest discover -s tools/arm7_handler_memory -p 'test_*.py' -v
